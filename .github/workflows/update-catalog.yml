name: Update Sentinel Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  repository_dispatch:
    types: [plugin-released]

permissions:
  contents: write

concurrency:
  group: sentinel-catalog-update
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out central catalog
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run generator tests
        run: npm test

      - name: Generate and validate candidate catalog
        run: |
          node generator/generate-catalog.mjs \
            --output "$RUNNER_TEMP/candidate-repo.json" \
            --verify-assets
          pwsh -File ./.github/scripts/Test-Catalog.ps1 \
            -CatalogPath "$RUNNER_TEMP/candidate-repo.json"

      - name: Publish atomic reconciliation
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node generator/publish-catalog.mjs

      - name: Report result
        run: |
          echo "Catalog changed: ${{ steps.publish.outputs.changed }}"
          echo "Catalog commit: ${{ steps.publish.outputs.catalog_commit }}"
