name: Validate Catalog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out catalog
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run generator tests
        run: npm test

      - name: Generate from authoritative child manifests
        run: |
          node generator/generate-catalog.mjs \
            --output "$RUNNER_TEMP/candidate-repo.json" \
            --verify-assets
          pwsh -File ./.github/scripts/Test-Catalog.ps1 \
            -CatalogPath "$RUNNER_TEMP/candidate-repo.json"

      - name: Require a reconciled checked-in catalog
        run: diff -u repo.json "$RUNNER_TEMP/candidate-repo.json"

  distribution:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test child publication, conflict, notification and timeout policies
        run: node --test release/*.test.mjs
      - name: Read-only token-free smoke of all seven published entries
        run: node release/smoke.mjs
      - name: Exercise composite action without writes or notification credentials
        uses: ./.github/actions/distribute
        env:
          SENTINEL_REPOSITORY: MarshalTitan/SRankSentinel
        with:
          internal-name: SRankSentinel
          publish-child: 'false'
          source-token: ''
          timeout-seconds: '60'
